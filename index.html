<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Online Shopping Site for Fashion, Electronics, Home &amp; More | Meesho
    </title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_forward"
    />
  </head>
  <body class="bg-amber-200">
    <!-- Title Heading fixed position -->
    <div
      class="flex items-center justify-between shadow-xl sticky top-0 bg-white z-10"
    >
      <img src="./img/mysho--logo.png" class="w-[100px]" id="logo" alt="" />

      <div class="flex border rounded-[8px] p-1 w-[40%] hidden md:flex">
        <img src="./img/search-icon.png" class="w-[50px]" alt="" />
        <input
          type="text"
          placeholder="Search Here"
          class="outline-none hidden md:flex w-[80%]"
        />
      </div>

      <div
        style="margin-right: 5px"
        class="flex items-center text-gray-600 hidden md:flex"
      >
        <a href=""><p>Become a Seller</p></a>
        <img class="w-[50px] h-[35px]" src="./img/cart.png" alt="" />
        <img class="w-[50px] h-[35px]" src="./img/profile.png" alt="" />
      </div>

      <img id="menuicon" class="cursor-pointer w-[70px] md:hidden" src="./img/menu.png" alt="" />
    </div>

    <!-- Side nav bar -->
     <div id="sidenav" class="bg-black fixed z-10 top-0 right-0 text-white transition-all duration-1000" style="width: 270px; height: 100vh; right: -270px;">
      <div class="relative">
        <img id="sidenav_cross" src="./img/cross.png" class="w-5 absolute right-5 top-3 cursor-pointer" alt="">
      </div>
        <ul class="flex flex-col items-center gap-10" style="margin-top: 70px;">
          <a href="index.html"><li>Home</li></a>
          <a href="collections.html"><li>Collections</li></a>
          <a href="contact us.html">Contact Us</a>
        </ul>
     </div>

    <!-- Banner Section -->
    <div class="relative z">
      <img class="w-full" src="./img/inner banner.jpg" alt="" />

      <div id="banner-x" class="bg-[#FDEEFA] flex justify-center relative h-14">
        <div
          id="bannner-l"
          class="flex w-[97%] gap-3 border bg-white h-[30px] rounded-[5px] absolute top-3 items-center"
        >
          <img class="max-[501px]:w-5 w-7" src="./img/returns.svg" alt="" />
          <p class="max-[501px]:text-[10px] max-[900px]:font-bold text-[14px]">
            7 Days Easy Return
          </p>
          <p>|</p>
          <img class="max-[501px]:w-5 w-7" src="./img/cod.svg" alt="" />
          <p class="max-[501px]:text-[10px] max-[900px]:font-bold text-[14px]">
            Cash on Delivery
          </p>
          <p>|</p>
          <img
            class="max-[501px]:w-5 w-7"
            src="./img/lowest-price.svg"
            alt=""
          />
          <p class="max-[501px]:text-[10px] max-[900px]:font-bold text-[14px]">
            Lowest Prices
          </p>
        </div>
      </div>
    </div>

    <!-- Brands bar sections -->
  

    <div class="brands_container .//. flex justify-around" style="margin: 8px;">
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/puma.png" class="w-10 max-[501px]:w-8"  alt="" />
        <p class="max-[501px]:text-[13px]">Puma</p>
      </div>
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/simple.png" class="w-10 max-[501px]:w-8" alt="" />
        <p class="max-[501px]:text-[13px]">Simple</p>
      </div>
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/twitch.png" class="w-10 max-[501px]:w-8" alt="" />
        <p class="max-[501px]:text-[13px]">twitch</p>
      </div>
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/adidas.png" class="w-10 max-[501px]:w-8" alt="" />
        <p class="max-[501px]:text-[13px]">adidas</p>
      </div>
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/behaance.png" class="w-10 max-[501px]:w-8" alt="" />
        <p class="max-[501px]:text-[13px]">behaance</p>
      </div>
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/leaves.png" class="w-10 max-[501px]:w-8" alt="" />
        <p class="max-[501px]:text-[13px]">leaves</p>
      </div>
      <div class="brands_container-list .//. w-fit">
        <img src="./img/icons/nike.png" class="w-10 max-[501px]:w-8" alt="" />
        <p class="max-[501px]:text-[13px]">nike</p>
      </div>
    </div>

    <!-- footer section -->
    <div class="bg-black text-white" style="padding: 30px">
      <h1 class="text-[30px] font-bold">Mysho</h1>
      <p class="text-[12px] font-extralight">
        The Standard chunk of lorem ipsum used since the 1500s is reprodused
        blow for those interest
      </p>
      <div class="flex gap-10">
        <img
          src="./img/twitter.png"
          style=""
          class="bg-black w-[20px]"
          alt=""
        />
        <img
          src="./img/instagram.png"
          style=""
          class="bg-black w-[20px]"
          alt=""
        />
        <img
          src="./img/facebook.png"
          style=""
          class="bg-black w-[20px]"
          alt=""
        />
      </div>
      <p>@ 2026 Mysho.com</p>
    </div>
    <script src="Javascript.js"></script>
  </body>
</html>
