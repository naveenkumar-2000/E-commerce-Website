<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Online Shopping Site for Fashion, Electronics, Home &amp; More | Meesho
    </title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Title Heading fixed position -->
    <div
      class="flex items-center justify-between shadow-xl sticky top-0 bg-white"
    >
      <img src="./img/mysho--logo.png" class="w-[100px]" id="logo" alt="" />

      <div class="flex border rounded-[8px] p-1 w-[40%] hidden md:flex">
        <img src="./img/search-icon.png" class="w-[50px]" alt="" />
        <input
          type="text"
          placeholder="Search Here"
          class="outline-none hidden md:flex w-[80%]"
        />
      </div>

      <div
        style="margin-right: 5px"
        class="flex items-center text-gray-600 hidden md:flex"
      >
        <a href=""><p>Become a Seller</p></a>
        <img class="w-[50px] h-[35px]" src="./img/cart.png" alt="" />
        <img class="w-[50px] h-[35px]" src="./img/profile.png" alt="" />
      </div>

      <img class="w-[70px] md:hidden" src="./img/menu.png" alt="" />
    </div>

    <!-- Banner Section -->

    <div class="relative">
      <img class="w-full" src="./img/inner banner.jpg" alt="" />

      <div id="banner-x" class="bg-[#FDEEFA] flex justify-center relative h-14">
        <div id="bannner-l" class="flex w-[97%] gap-3 border bg-white h-[30px] rounded-[5px] absolute top-3 items-center">
          <img class="max-[501px]:w-5 w-7" src="./img/returns.svg" alt="" />
          <p class="max-[501px]:text-[10px] max-[900px]:font-bold text-[14px]">7 Days Easy Return</p>
          <p>|</p>
          <img class="max-[501px]:w-5 w-7" src="./img/cod.svg" alt="" />
          <p class="max-[501px]:text-[10px] max-[900px]:font-bold text-[14px]">Cash on Delivery</p>
          <p>|</p>
          <img class="max-[501px]:w-5 w-7" src="./img/lowest-price.svg" alt="" />
          <p class=" max-[501px]:text-[10px] max-[900px]:font-bold text-[14px]">Lowest Prices</p>
        </div>
      </div>
    </div>

    <script src="js.js"></script>
  </body>
</html>
