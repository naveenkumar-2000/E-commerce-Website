<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Online Shopping Site for Fashion, Electronics, Home &amp; More | Meesho
    </title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Title Heading fixed position -->
    <div class="flex items-center justify-between shadow-xl sticky top-0 bg-white">
      <img src="./img/mysho--logo.png" class="w-[100px] " id="logo"  alt="" />

      <div class="flex border rounded-[8px] p-1 w-[40%] hidden md:flex">
        <img src="./img/search-icon.png" class="w-[50px]" alt="" />
        <input
          type="text"
          placeholder="Search Here"
          class="outline-none hidden md:flex w-[80%]"
        />
      </div>

      <div style="margin-right: 5px;" class="flex items-center text-gray-600 hidden md:flex">
        <a href=""><p>Become a Seller</p></a>
        <img class="w-[50px] h-[35px]" src="./img/cart.png" alt="">
        <img class="w-[50px] h-[35px]" src="./img/profile.png" alt="">
      </div>
      
      <img class="w-[70px] md:hidden" src="./img/menu.png" alt="" />      
    </div>
    
    




































    <!-- /////-----Pixel Indicator-----\\\\\ -->
    <style>
      * {
        margin: 0px;
      }
    </style>
    <!-- பிக்சல் அளவைக் காட்டும் பிக்ஸட் பாக்ஸ் -->
    <div
      style="
        width: 100%;
        text-align: center;
        position: fixed;
        bottom: 0px;
        background: rgb(222, 255, 188);
        color: black;
        padding: 5px;
        font-family: sans-serif;
        font-weight: bold;
        z-index: 9999;
      "
    >
      Width: <span id="page-width">0px</span>
    </div>

    <script>
      // பிக்சல் அளவைக் காட்டும் span டேக்
      const pageWidthSpan = document.getElementById("page-width");

      // அகலத்தைக் கணக்கிட்டு அப்டேட் செய்யும் ஃபங்க்ஷன்
      function updateWidth() {
        let currentWidth = window.innerWidth; // தற்போதைய அகலம் (Pixel)
        pageWidthSpan.textContent = currentWidth + "px";
      }

      // பக்கம் லோட் ஆகும்போதும், ரீசைஸ் ஆகும்போதும் வேலை செய்ய
      window.addEventListener("resize", updateWidth);
      window.addEventListener("DOMContentLoaded", updateWidth);
    </script>
    <!-- /////-----Pixel Indicator-----\\\\\ -->
    <script src="js.js"></script>
  </body>
</html>
