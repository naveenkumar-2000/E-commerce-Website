<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- Title Heading fixed position -->
    <div
      class="flex items-center justify-between shadow-xl sticky top-0 bg-white z-10"
    >
      <img src="./img/mysho--logo.png" class="w-[100px]" id="logo" alt="" />

      <div class="flex border rounded-[8px] p-1 w-[40%] hidden md:flex">
        <img src="./img/search-icon.png" class="w-[50px]" alt="" />
        <input type="text" placeholder="Search Here" class="outline-none hidden md:flex w-[80%]"/>
      </div>

      <div style="margin-right: 5px" class="flex items-center text-gray-600 hidden md:flex">
        <a href=""><p>Become a Seller</p></a>
        <img class="w-[50px] h-[35px]" src="./img/cart.png" alt="" />
        <img class="w-[50px] h-[35px]" src="./img/profile.png" alt="" />
        <img id="menuicon" class="cursor-pointer w-[70px]" src="./img/menu.png" alt="" />
      </div>
      
      <img id="menuicon-2" class="cursor-pointer w-[70px]  md:hidden" src="./img/menu.png" alt="" />
    </div>
    
    <!-- Side nav bar -->
     <div id="sidenav" class="bg-black fixed z-10 top-0 right-0 text-white transition-all duration-1000" style="width: 270px; height: 100vh; right: -270px;">
      <div class="relative">
        <img id="sidenav_cross" src="./img/cross.png" class="w-5 absolute right-5 top-3 cursor-pointer" alt="">
      </div>
        <ul class="flex flex-col items-center gap-10" style="margin-top: 70px;">
          <a href="index.html"><li>Home</li></a>
          <a href="products.html"><li>Collections</li></a>
          <a href="contact us.html">Contact Us</a>
        </ul>
     </div>

      <section class="divide-section">

    <!-- Left side: filters -->
    <aside class="filter-section">
      <div class="filters-top">
        <h2>Filters</h2>
        <button type="button" class="clear-filters" id="clearFilters">Clear</button>
      </div>

      <div class="filter-group">
        <h3>Occasion</h3>
        <label><input type="checkbox" name="occasion" value="summer"> Summer</label>
        <label><input type="checkbox" name="occasion" value="party"> Party</label>
        <label><input type="checkbox" name="occasion" value="beach"> Beach</label>
      </div>

      <div class="filter-group">
        <h3>Colors</h3>
        <label><input type="checkbox" name="color" value="red"> Red</label>
        <label><input type="checkbox" name="color" value="blue"> Blue</label>
        <label><input type="checkbox" name="color" value="white"> White</label>
        <label><input type="checkbox" name="color" value="green"> Green</label>
      </div>

      <div class="filter-group">
        <h3>Arrivals</h3>
        <label><input type="checkbox" name="arrival" value="new"> New</label>
        <label><input type="checkbox" name="arrival" value="old"> Old</label>
      </div>

      <div class="filter-group">
        <h3>Price</h3>
        <label><input type="checkbox" name="price" value="under300"> Under ₹300</label>
        <label><input type="checkbox" name="price" value="300to500"> ₹300 – ₹500</label>
        <label><input type="checkbox" name="price" value="above500"> Above ₹500</label>
      </div>
    </aside>

    <!-- Right side: search + products -->
    <div class="product-section">
      <div class="navbar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="searchInput" placeholder="search">
      </div>
      <p class="result-count" id="resultCount"></p>

      <div class="products" id="products"></div>
      <p class="empty-products" id="noProducts">No products match this filter. Try another option or clear filters.</p>
    </div>

    </section>


     <!-- footer section -->
    <div class="bg-black text-white" style="padding: 30px">
      <h1 class="text-[30px] font-bold">Mysho</h1>
      <p class="text-[12px] font-extralight">
        The Standard chunk of lorem ipsum used since the 1500s is reprodused
        blow for those interest
      </p>
      <div class="flex gap-10">
        <img
          src="./img/twitter.png"
          style=""
          class="bg-black w-[20px]"
          alt=""
        />
        <img
          src="./img/instagram.png"
          style=""
          class="bg-black w-[20px]"
          alt=""
        />
        <img
          src="./img/facebook.png"
          style=""
          class="bg-black w-[20px]"
          alt=""
        />
      </div>
      <p>@ 2026 Mysho.com</p>
    </div>


     <script src="Javascript.js"></script>
</body>
</html>
